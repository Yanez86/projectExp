name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && vars.PAGES_ENABLED == 'true'
        with:
          path: apps/client/dist

  # Pubblica su GitHub Pages solo quando Pages è attivo sul repository (Settings → Pages →
  # Source: GitHub Actions) e la variabile del repository PAGES_ENABLED vale "true".
  deploy:
    if: github.event_name == 'push' && vars.PAGES_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
